 <radialGradient id="moon"><stop stop-color="#fff7dc"/><stop offset=".7" stop-color="#c8b8ff"/><stop offset="1" stop-color="#8a70d9"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
