<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#09091f"/><stop offset=".48" stop-color="#29165c"/><stop offset="1" stop-color="#080b20"/></linearGradient>
 <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#39206f"/><stop offset=".55" stop-color="#152c5b"/><stop offset="1" stop-color="#071323"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4a8ff"/><stop offset=".45" stop-color="#8756e9"/><stop offset="1" stop-color="#36216d"/></linearGradient>
